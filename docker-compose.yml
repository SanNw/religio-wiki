services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: religiowiki
      MARIADB_USER: religiowiki
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  mediawiki:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      # Envio de e-mail (SMTP) para a confirmação de conta. Os VALORES ficam no
      # arquivo .env da VPS (NÃO commitado — repositório é público); aqui só o
      # repasse. Enquanto RW_SMTP_HOST estiver vazio, o wiki não tenta enviar
      # e-mail (o LocalSettings só ativa o $wgSMTP quando a variável existe).
      RW_SMTP_HOST: ${RW_SMTP_HOST:-}
      RW_SMTP_PORT: ${RW_SMTP_PORT:-587}
      RW_SMTP_USER: ${RW_SMTP_USER:-}
      RW_SMTP_PASS: ${RW_SMTP_PASS:-}
      RW_SMTP_IDHOST: ${RW_SMTP_IDHOST:-religiowiki.com}
      RW_MAIL_FROM: ${RW_MAIL_FROM:-no-reply@religiowiki.com}
      # Doação (Stripe) -- chave SECRETA nunca fica no código/commit, só no
      # .env da VPS. Enquanto vazia, Special:DonateCheckout recusa qualquer
      # pedido (ver SpecialDonateCheckout.php).
      RW_STRIPE_SECRET_KEY: ${RW_STRIPE_SECRET_KEY:-}
      RW_STRIPE_PUBLISHABLE_KEY: ${RW_STRIPE_PUBLISHABLE_KEY:-}
      # Pix via Mercado Pago (Boleto/Cartão continuam na Stripe -- ela
      # aceita Boleto normalmente, só o Pix que não estava ativado na
      # conta Stripe atual).
      RW_MERCADOPAGO_ACCESS_TOKEN: ${RW_MERCADOPAGO_ACCESS_TOKEN:-}
      # Segredo do Webhooks do Mercado Pago (painel > Webhooks -- diferente
      # do access token acima), pra validar a assinatura X-Signature em
      # Special:DonateMercadoPagoWebhook. Enquanto vazio, o webhook aceita
      # notificações sem validar assinatura (só loga um aviso).
      RW_MERCADOPAGO_WEBHOOK_SECRET: ${RW_MERCADOPAGO_WEBHOOK_SECRET:-}
    volumes:
      - ./LocalSettings.php:/var/www/html/LocalSettings.php
      - wiki_images:/var/www/html/images
      # Log do canal 'religio-donate' (wfDebugLog em Stripe/Pix/webhook) --
      # montado do host pra sobreviver a rebuild/recreate do container
      # (diferente de um arquivo dentro da imagem, que some).
      - ./logs:/var/log/religio

  # Zotero translation-server: extrai metadados de citação de uma URL de
  # verdade (usa os "tradutores" do Zotero, específicos por site). Só o
  # citoid fala com ele -- nenhuma porta publicada pro host/internet.
  zotero:
    build: ./zotero
    restart: unless-stopped

  # Citoid: serviço que o botão de citação do VisualEditor chama
  # ($wgCitoidServiceUrl no LocalSettings.php) pra gerar uma citação
  # completa a partir de URL/DOI/ISBN. Depende do zotero acima. Só a porta
  # 1970 é publicada no HOST (127.0.0.1), pra debug via curl -- não é
  # exposta na internet (nginx da VPS só repassa a 8080/mediawiki).
  citoid:
    build: ./citoid
    restart: unless-stopped
    depends_on:
      - zotero
    ports:
      - "127.0.0.1:1970:1970"

  # Redis: rate limiting (sliding window) e dedupe de fingerprint (TTL 1h)
  # do trust-gateway abaixo. Sem persistência AOF/RDS de propósito -- todo
  # dado aqui é efêmero por natureza (janela de rate limit, cache de
  # fingerprint); perder o conteúdo num restart não é um problema.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Postgres dedicado ao trust-gateway (Fase 2 do sistema anti-bot -- ver
  # scratch/religio-antibot-trust-gateway.html). Nome "trust-postgres" (não
  # "db", que já é o MariaDB do MediaWiki) pra deixar claro que são dois
  # bancos completamente separados, sem relação entre si.
  trust-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trust_gateway
      POSTGRES_USER: trust_gateway
      POSTGRES_PASSWORD: ${TRUST_DB_PASSWORD}
    volumes:
      - trust_db_data:/var/lib/postgresql/data

  # Trust Gateway: Fase 2 do sistema anti-bot. Bot score ponderado (honeypot
  # + timing + fingerprint + velocidade de cadastro) chamado pelo
  # AntiBotPreAuthenticationProvider.php via HTTP no cadastro
  # (POST /trust/signup-risk). Só porta interna (nome de serviço Docker) --
  # nunca exposta pra internet, mesmo padrão do zotero.
  trust-gateway:
    build: ./trust-gateway
    restart: unless-stopped
    depends_on:
      - redis
      - trust-postgres
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://trust_gateway:${TRUST_DB_PASSWORD}@trust-postgres:5432/trust_gateway

volumes:
  db_data:
  wiki_images:
  trust_db_data:
